```yaml
name: Build LuiX-System Pomodoro for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Compilar o aplicativo
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/classes
          javac -d build/classes src/Pomodoro.java src/PomodoroApp.java
          Copy-Item src/logo.png build/classes/src/logo.png
          jar --create --file build/PomodoroApp.jar --main-class src.PomodoroApp -C build/classes .
          New-Item -ItemType Directory -Force build/package-input
          Copy-Item build/PomodoroApp.jar build/package-input/

      - name: Gerar instalador Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/windows
          jpackage `
            --type exe `
            --name "LuiX-System-Pomodoro" `
            --app-version 1.0.0 `
            --description "Aplicativo Pomodoro para produtividade" `
            --vendor "LuiX-System" `
            --input build/package-input `
            --main-jar PomodoroApp.jar `
            --main-class src.PomodoroApp `
            --dest build/windows

      - name: Disponibilizar instalador
        uses: actions/upload-artifact@v4
        with:
          name: LuiX-System-Pomodoro-Windows
          path: build/windows/*.exe
```